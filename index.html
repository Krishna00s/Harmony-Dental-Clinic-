<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Harmony Dental Care — Thoughtful Care, Without the Noise</title>
    <meta name="description" content="Personalized dental care built around listening, clear guidance, and a treatment plan designed specifically for you in San Diego, CA." />
    
    <!-- OpenGraph Metadata -->
    <meta property="og:title" content="Harmony Dental Care — Thoughtful Care, Without the Noise" />
    <meta property="og:description" content="Personalized dental care built around listening, clear guidance, and treatment designed around you." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://harmonydental.demo/" />
    
    <!-- JSON-LD Structured Data for Dentist / MedicalBusiness -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Dentist",
        "name": "Harmony Dental Care",
        "image": "https://images.unsplash.com/photo-1629909613654-28e377c37b09?auto=format&fit=crop&q=80&w=1200",
        "telephone": "+1-555-234-5678",
        "email": "hello@harmonydental.demo",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "123 Healthcare Way, Suite 400",
          "addressLocality": "San Diego",
          "addressRegion": "CA",
          "postalCode": "92101",
          "addressCountry": "US"
        },
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": "32.7157",
          "longitude": "-117.1611"
        },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday"],
            "opens": "08:00",
            "closes": "17:00"
          },
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Friday"],
            "opens": "08:00",
            "closes": "14:00"
          }
        ],
        "priceRange": "$$"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
